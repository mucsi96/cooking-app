[package]
name = "cooking-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
members = ["migration"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
azure_identity = "1.0"
azure_security_keyvault_secrets = "1.0"
base64 = "0.22"
chrono = "0.4"
ipnet = "2"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
loco-rs = { version = "1.3", default-features = false, features = ["cli", "with-db", "db-postgres"] }
migration = { path = "migration" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "2", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-json", "with-uuid", "with-chrono"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
