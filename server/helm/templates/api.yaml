apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  annotations:
    azure.workload.identity/client-id: {{ required "clientId is required" .Values.clientId | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Release.Name }}
          image: {{ required "image is required" .Values.image | quote }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 8081}
          env:
            - {name: SERVER_PORT, value: "8080"}
            - {name: MANAGEMENT_PORT, value: "8081"}
            - {name: STORAGE_DIRECTORY, value: /app/storage}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          startupProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: storage, mountPath: /app/storage}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Values.storage.claimName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-route
spec:
  parentRefs:
    - {name: traefik, namespace: traefik, sectionName: websecure}
  hostnames:
    - {{ required "host is required" .Values.host | quote }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - {name: {{ .Release.Name }}, port: 8080}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.storage.claimName }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: {{ .Values.storage.volumeName }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
