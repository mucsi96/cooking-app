server:
  BindAddress: 0.0.0.0:4180
providers:
  - id: test
    provider: oidc
    clientID: cooking-web
    clientSecret: fixture-web-secret
    scope: openid profile email offline_access api://mock-api-client-id/api-access
    code_challenge_method: S256
    additionalClaims: [name]
    oidcConfig:
      issuerURL: http://localhost:8060/default
      emailClaim: preferred_username
      userIDClaim: sub
      insecureSkipNonce: false
injectResponseHeaders:
  - name: Authorization
    values:
      - claimSource:
          claim: access_token
          prefix: "Bearer "
upstreamConfig:
  upstreams:
    - id: auth
      path: /
      static: true
      staticCode: 202
