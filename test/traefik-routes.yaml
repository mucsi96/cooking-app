http:
  routers:
    server:
      rule: "PathPrefix(`/api`)"
      priority: 2
      service: server
      entryPoints: [web]
    client:
      rule: "PathPrefix(`/`)"
      priority: 1
      service: client
      entryPoints: [web]
      middlewares: [spa-document]
  middlewares:
    spa-document:
      replacePathRegex:
        regex: "^(/[^.?]*)?$"
        replacement: /index.html
  services:
    server:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8064
    client:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8000
