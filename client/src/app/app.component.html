<mat-toolbar class="header">
  <nav aria-label="Fő navigáció">
    <span class="brand">Szakácskönyv</span>
    @if(isAuthenticated()) {
    <div class="primary-navigation">
      <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>restaurant_menu</mat-icon>
        <span>Receptek</span>
      </a>
      <a mat-button routerLink="/importalas" routerLinkActive="active">
        <mat-icon>add_circle_outline</mat-icon>
        <span>Importálás</span>
      </a>
    </div>
    <app-header></app-header>
    }
  </nav>
</mat-toolbar>

<main>
  @if (authError(); as error) {
  <div class="auth-error" role="alert">
    <h1>Bejelentkezés szükséges</h1>
    <p class="auth-error-details">{{ error }}</p>
    <button mat-flat-button (click)="retryLogin()">
      Újra bejelentkezem
    </button>
  </div>
  }
  @if (userData()) {
    <router-outlet></router-outlet>
  }
</main>
