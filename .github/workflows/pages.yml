name: Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate diff of last 2 weeks
        run: |
          mkdir -p _site
          since=$(date -d '14 days ago' '+%Y-%m-%d')

          git log --since="$since" --pretty=format:"%h %s" > _site/commits.txt

          git diff $(git log --since="$since" --reverse --pretty=format:"%H" | head -1)^..HEAD -- . ':!package-lock.json' ':!pom.xml' > _site/diff.patch 2>/dev/null || \
            git diff $(git log --since="$since" --reverse --pretty=format:"%H" | head -1)..HEAD -- . ':!package-lock.json' ':!pom.xml' > _site/diff.patch 2>/dev/null || \
            echo "No changes in the last 2 weeks" > _site/diff.patch

          cp _site/diff.patch _site/diff.txt

      - uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
