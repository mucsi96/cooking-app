name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-build-server-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          tags: localhost/cooking-app-server:test
          outputs: type=docker,dest=/tmp/server-image.tar
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Upload server image
        uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: /tmp/server-image.tar
          retention-days: 1

  build-client-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-client-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          tags: localhost/cooking-app-client:test
          outputs: type=docker,dest=/tmp/client-image.tar
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
      - name: Upload client image
        uses: actions/upload-artifact@v4
        with:
          name: client-image
          path: /tmp/client-image.tar
          retention-days: 1

  build-mock-anthropic-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-mock-anthropic-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build mock anthropic image
        uses: docker/build-push-action@v6
        with:
          context: mock_anthropic_server
          tags: localhost/cooking-app-mock-anthropic:test
          outputs: type=docker,dest=/tmp/mock-anthropic-image.tar
          cache-from: type=gha,scope=mock-anthropic
          cache-to: type=gha,mode=max,scope=mock-anthropic
      - name: Upload mock anthropic image
        uses: actions/upload-artifact@v4
        with:
          name: mock-anthropic-image
          path: /tmp/mock-anthropic-image.tar
          retention-days: 1

  build-mock-openai-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-mock-openai-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build mock openai image
        uses: docker/build-push-action@v6
        with:
          context: mock_openai_server
          tags: localhost/cooking-app-mock-openai:test
          outputs: type=docker,dest=/tmp/mock-openai-image.tar
          cache-from: type=gha,scope=mock-openai
          cache-to: type=gha,mode=max,scope=mock-openai
      - name: Upload mock openai image
        uses: actions/upload-artifact@v4
        with:
          name: mock-openai-image
          path: /tmp/mock-openai-image.tar
          retention-days: 1

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-test-e2e-${{ github.ref }}
      cancel-in-progress: true
    needs: [build-server-image, build-client-image, build-mock-anthropic-image, build-mock-openai-image]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: test/package-lock.json
      - name: Install dependencies
        working-directory: test
        run: npm ci
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/node_modules/playwright-core/package.json') }}
      - name: Install Chromium and Linux dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: test
        run: npx playwright install chromium --with-deps
      - name: Install Linux dependencies for cached Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: test
        run: npx playwright install-deps chromium
      # Only the image tarballs. Without the pattern this also pulls the
      # .dockerbuild build records docker/build-push-action uploads on its own,
      # which this job has no use for and which failed the whole step when one
      # of them would not download.
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: "*-image"
          path: /tmp
          merge-multiple: true
      - name: Load images into Podman
        run: |
          podman load -i /tmp/server-image.tar
          podman load -i /tmp/client-image.tar
          podman load -i /tmp/mock-anthropic-image.tar
          podman load -i /tmp/mock-openai-image.tar
      - name: Check the server executable runs
        run: |
          timeout 60 podman run --rm localhost/cooking-app-server:test \
            --version
      - name: Setup test environment and start pod
        env:
          SKIP_BUILD: "1"
        run: scripts/pod_up.sh
      - name: Run Playwright tests
        working-directory: test
        run: npx playwright test
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test/test-results
      - name: Collect pod logs
        if: always()
        run: |
          for container in $(podman pod inspect cooking-app-test --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null); do
            echo "$container" | grep -q "infra" && continue
            echo "=== $container ==="
            podman logs "$container" 2>&1 || true
          done

  publish-server:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: ${{ github.workflow }}-publish-server-${{ github.ref }}
      cancel-in-progress: false
    needs: test-e2e
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.get_next_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get next version
        id: get_next_version
        uses: mucsi96/get-next-version@main
        with:
          prefix: 'server'
          src: server

      - name: Set up Docker Buildx
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runtime configuration lets the same build serve every environment.
      - name: Build server image
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: ghcr.io/${{ github.repository }}-server:${{ steps.get_next_version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Check the server executable runs
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        env:
          SERVER_IMAGE: ghcr.io/${{ github.repository }}-server:${{ steps.get_next_version.outputs.version }}
        run: |
          timeout 60 docker run --rm "$SERVER_IMAGE" --version

      - name: Push server image
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        env:
          SERVER_IMAGE: ghcr.io/${{ github.repository }}-server:${{ steps.get_next_version.outputs.version }}
        run: docker push "$SERVER_IMAGE"

      # Tag the commit whose versioned image was published, even if main has advanced.
      - name: Create release
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_next_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  publish-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-publish-client-${{ github.ref }}
      cancel-in-progress: false
    needs: test-e2e
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.get_next_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get next version
        id: get_next_version
        uses: mucsi96/get-next-version@main
        with:
          prefix: 'client'
          src: client

      - name: Set up Docker Buildx
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client image
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          tags: ghcr.io/${{ github.repository }}-client:${{ steps.get_next_version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      # Tag the commit this image was built from, not whatever main points at
      # by the time the release is created - see publish-server above.
      - name: Create release
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_next_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    needs: [publish-server, publish-client]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.2.7'

      - name: Connect to Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Deploy to Kubernetes
        env:
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
          SERVER_IMAGE: ghcr.io/${{ github.repository }}-server:${{ needs.publish-server.outputs.version }}
          CLIENT_IMAGE: ghcr.io/${{ github.repository }}-client:${{ needs.publish-client.outputs.version }}
        run: scripts/deploy.sh
